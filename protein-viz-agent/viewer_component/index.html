<!doctype html>
<meta charset="utf-8">
<!--
  Developer : Abdullah Al Mamun

  Host page for the NGL viewer.

  The viewer's markup and script are still generated by build_ngl_html() in
  app.py; this file exists only to give them a way to talk *back* to Python.
  st.components.v1.html renders a one-way iframe, so anything the user changed
  inside the viewer — a label they placed, a representation they picked — was
  lost on the next Streamlit rerun, which happens on every chat message and
  every widget click. A declared component can call setComponentValue, so those
  edits reach session state and survive.

  The Streamlit component protocol is implemented by hand here rather than
  through the React template, so the app needs no build step: it is three
  postMessage shapes, documented at
  https://docs.streamlit.io/develop/concepts/custom-components/intro
-->
<style>
  html,body{margin:0;padding:0;background:transparent;}
  #root{width:100%;}
  #grip{height:10px;cursor:ns-resize;display:flex;align-items:center;
        justify-content:center;touch-action:none;user-select:none;}
  #grip::after{content:"";width:48px;height:4px;border-radius:2px;background:#888;opacity:.6;}
  #grip:hover::after,#grip.drag::after{opacity:1;background:#4a90e2;}
</style>
<div id="root"></div>
<div id="grip" title="Drag to resize the viewer · double-click to fit the window"></div>
<script>
(function () {
  var READY = false;
  var lastHtml = null;
  var seq = 0;

  // ── Viewer height ──────────────────────────────────────────────────────
  // The template draws #wrap at a fixed 680px, which is small on a tall
  // screen. By default the viewer fills from its top edge down to the bottom
  // of the browser window; dragging the grip under it sets an explicit
  // height, remembered across reruns. Double-click the grip to go back to
  // fitting the window.
  var KEY = "parora.viewerHeight";
  var GRIP = 10, BORDER = 2, MIN_H = 300, MAX_H = 4000;
  var userH = null;
  try { userH = parseInt(localStorage.getItem(KEY), 10) || null; } catch (e) {}

  function autoHeight() {
    try {
      var top = window.frameElement.getBoundingClientRect().top;
      return Math.max(420, Math.round(window.parent.innerHeight - top - GRIP - BORDER - 16));
    } catch (e) {
      return 680;   // parent not reachable (cross-origin): template default
    }
  }

  var autoH = null;
  function currentHeight() { return userH || autoH || (autoH = autoHeight()); }

  function applyHeight(h) {
    var wrap = document.getElementById("wrap");
    if (wrap) { wrap.style.height = h + "px"; }
    setFrameHeight(h + BORDER + GRIP);
    // NGL resizes its canvas on window resize; the iframe's own resize can
    // lag behind the frame-height message, so nudge it directly.
    window.dispatchEvent(new Event("resize"));
  }

  try {
    window.parent.addEventListener("resize", function () {
      if (userH) return;
      autoH = autoHeight();
      applyHeight(autoH);
    });
  } catch (e) {}

  (function () {
    var grip = document.getElementById("grip");
    var startY = 0, startH = 0, pending = null;
    grip.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      grip.setPointerCapture(e.pointerId);   // keep tracking outside the iframe
      grip.classList.add("drag");
      startY = e.screenY;
      startH = currentHeight();
    });
    grip.addEventListener("pointermove", function (e) {
      if (!grip.hasPointerCapture(e.pointerId)) return;
      userH = Math.min(MAX_H, Math.max(MIN_H, Math.round(startH + e.screenY - startY)));
      if (pending) return;
      pending = requestAnimationFrame(function () { pending = null; applyHeight(userH); });
    });
    function end(e) {
      if (!grip.hasPointerCapture(e.pointerId)) return;
      grip.releasePointerCapture(e.pointerId);
      grip.classList.remove("drag");
      try { localStorage.setItem(KEY, String(userH)); } catch (err) {}
    }
    grip.addEventListener("pointerup", end);
    grip.addEventListener("pointercancel", end);
    grip.addEventListener("dblclick", function () {
      userH = null;
      try { localStorage.removeItem(KEY); } catch (err) {}
      autoH = autoHeight();
      applyHeight(autoH);
    });
  })();

  function post(msg) {
    msg.isStreamlitMessage = true;
    window.parent.postMessage(msg, "*");
  }

  function setFrameHeight(h) {
    post({type: "streamlit:setFrameHeight", height: h});
  }

  // Every event carries a monotonic counter. Streamlit replays the last
  // component value on each rerun, so without it Python would re-apply the
  // same label or style change over and over.
  window.paroraEmit = function (event) {
    seq += 1;
    post({
      type: "streamlit:setComponentValue",
      value: Object.assign({n: seq, t: Date.now()}, event),
      dataType: "json"
    });
  };

  // innerHTML does not run <script> tags, so they are re-created in order:
  // external ones are awaited, inline ones evaluated once their dependency
  // (NGL) is on the page.
  function injectScripts(container, done) {
    var scripts = Array.prototype.slice.call(container.querySelectorAll("script"));
    scripts.forEach(function (s) { s.parentNode.removeChild(s); });
    (function next(i) {
      if (i >= scripts.length) { done(); return; }
      var old = scripts[i];
      var el = document.createElement("script");
      if (old.src) {
        el.src = old.src;
        el.onload = function () { next(i + 1); };
        el.onerror = function () {
          console.error("PARORA viewer: failed to load " + old.src);
          next(i + 1);
        };
        document.body.appendChild(el);
      } else {
        el.textContent = old.textContent;
        document.body.appendChild(el);
        next(i + 1);
      }
    })(0);
  }

  // The Python-side `height` argument is no longer the viewer's size; the
  // host picks it (see currentHeight) so a rebuilt scene keeps the size the
  // user dragged it to.
  function render(html) {
    var root = document.getElementById("root");
    root.innerHTML = html;
    applyHeight(currentHeight());
    injectScripts(root, function () { applyHeight(currentHeight()); });
  }

  window.addEventListener("message", function (e) {
    if (!e.data || e.data.type !== "streamlit:render") return;
    var args = e.data.args || {};
    var html = args.html || "";
    // Streamlit re-sends render on every rerun. Rebuilding an unchanged scene
    // would drop the camera and reload every structure, so skip it.
    if (html === lastHtml) { applyHeight(currentHeight()); return; }
    lastHtml = html;
    render(html);
  });

  if (!READY) {
    READY = true;
    post({type: "streamlit:componentReady", apiVersion: 1});
    setFrameHeight(700);
  }
})();
</script>
