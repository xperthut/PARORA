<!--
  Developer : Methun Kamruzzaman
  Summary   : PARORA — Single-page chat + 3D viewer UI.
              Chat panel sends user prompts to the FastAPI /api/chat endpoint
              and consumes the SSE stream it returns, applying each structured
              action (load_pdb, add_rep) to the NGL.js stage as it arrives so
              the 3D viewer updates progressively without a page reload.
              Representation state is tracked in a repMap (Map) so existing
              layers are removed before a replacement is added, enabling true
              in-place updates for color, opacity, and style changes.
              Avatars (user / bot SVG), gradient bubbles, dot-grid background,
              and fade-in animations are embedded directly in CSS/JS with no
              external UI dependencies beyond NGL.js (loaded via CDN).
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PARORA</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <script src="https://unpkg.com/ngl@2/dist/ngl.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    header img { height: 40px; }
    header h1 { font-size: 1.3rem; font-weight: 700; color: #1a1a2e; }
    header p  { font-size: 0.78rem; color: #64748b; margin-top: 1px; }

    /* ── Main split layout ── */
    main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Left panel: chat ── */
    #chat-panel {
      width: 320px;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-right: 1px solid #e2e8f0;
      flex-shrink: 0;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #eef2f7;
      background-image: radial-gradient(#d1d9e6 1px, transparent 1px);
      background-size: 22px 22px;
    }

    /* ── Message rows ── */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      animation: fadeUp 0.18s ease-out;
    }
    .msg-row.user      { flex-direction: row-reverse; }
    .msg-row.system    { justify-content: center; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Avatars ── */
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .user-avatar {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      box-shadow: 0 2px 8px rgba(37,99,235,0.40);
    }
    .bot-avatar {
      background: linear-gradient(135deg, #a78bfa, #6d28d9);
      box-shadow: 0 2px 8px rgba(109,40,217,0.38);
    }

    /* ── Bubbles ── */
    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 0.82rem;
      line-height: 1.6;
      max-width: 78%;
      word-break: break-word;
    }
    .msg-row.user .bubble {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 10px rgba(37,99,235,0.30);
    }
    .msg-row.assistant .bubble {
      background: #ffffff;
      color: #1f2937;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .msg-row.system .bubble {
      background: rgba(255,255,255,0.70);
      color: #94a3b8;
      font-size: 0.74rem;
      font-style: italic;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
    }

    #input-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px;
      border-top: 1px solid #e2e8f0;
      background: #ffffff;
    }
    #prompt {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: #374151;
      padding: 8px 10px;
      font-size: 0.82rem;
      font-family: inherit;
      resize: none;
      min-height: 80px;
    }
    #prompt:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px #dbeafe; }

    #send-btn {
      align-self: flex-end;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border: none;
      border-radius: 20px;
      color: #ffffff;
      padding: 7px 22px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      box-shadow: 0 2px 8px rgba(37,99,235,0.35);
      transition: opacity 0.15s, box-shadow 0.15s;
    }
    #send-btn:hover { opacity: 0.88; box-shadow: 0 3px 12px rgba(37,99,235,0.45); }
    #send-btn:disabled { opacity: 0.45; cursor: default; box-shadow: none; }

    #reset-btn {
      margin: 0 10px 10px;
      background: transparent;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: #64748b;
      padding: 5px;
      cursor: pointer;
      font-size: 0.78rem;
      transition: all 0.15s;
    }
    #reset-btn:hover { border-color: #94a3b8; color: #374151; }

    /* ── Right panel: 3D viewer ── */
    #viewer-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #viewer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
      min-height: 36px;
    }

    #status-text {
      font-size: 0.78rem;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #status-text .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid #cbd5e1;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    #status-text.busy .spinner { display: inline-block; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #bg-btn {
      background: transparent;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      color: #64748b;
      padding: 3px 10px;
      cursor: pointer;
      font-size: 0.78rem;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    #bg-btn:hover { border-color: #94a3b8; color: #374151; }

    /* ── Progress bar ── */
    #progress-bar {
      height: 3px;
      background: #e2e8f0;
      overflow: hidden;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }
    #progress-bar.hidden { opacity: 0; pointer-events: none; }
    #progress-fill {
      height: 100%;
      width: 35%;
      background: linear-gradient(90deg, #2563eb, #60a5fa);
      border-radius: 2px;
      animation: slide 1.4s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-150%); }
      100% { transform: translateX(380%); }
    }

    #viewport {
      flex: 1;
      background: #ffffff;
    }
  </style>
</head>
<body>

<header>
  <img src="/static/logo.png" onerror="this.style.display='none'" alt="logo">
  <div>
    <h1>PARORA</h1>
    <p>Protein Agentic Rendering &amp; Observation for Residue Analysis</p>
  </div>
</header>

<main>
  <!-- ── Chat panel ── -->
  <div id="chat-panel">
    <div id="messages">
      <div class="msg-row system"><div class="bubble">Load a structure to begin — e.g. "Load 3pp0"</div></div>
    </div>
    <div id="input-row">
      <textarea id="prompt" rows="4" placeholder="e.g. Load insulin, show ATP as ball+stick…"></textarea>
      <button id="send-btn">Process</button>
    </div>
    <button id="reset-btn">⟳ New structure</button>
  </div>

  <!-- ── NGL viewer ── -->
  <div id="viewer-panel">
    <div id="viewer-toolbar">
      <span id="status-text"><span class="spinner"></span><span id="status-label"></span></span>
      <button id="bg-btn">🌙 Dark</button>
    </div>
    <div id="progress-bar" class="hidden"><div id="progress-fill"></div></div>
    <div id="viewport"></div>
  </div>
</main>

<script>
  // ── NGL stage ─────────────────────────────────────────────────────────────
  const stage = new NGL.Stage("viewport", { backgroundColor: "white" });
  window.addEventListener("resize", () => stage.handleResize());

  let comp = null;
  let bgDark = false;
  const repMap = new Map();  // "type|selection" → NGL RepresentationComponent

  // ── Background toggle ──────────────────────────────────────────────────────
  document.getElementById("bg-btn").addEventListener("click", () => {
    bgDark = !bgDark;
    stage.setParameters({ backgroundColor: bgDark ? "black" : "white" });
    document.getElementById("bg-btn").textContent = bgDark ? "☀️ Light" : "🌙 Dark";
  });

  // ── Status / progress helpers ─────────────────────────────────────────────
  function setStatus(text) {
    const el = document.getElementById("status-text");
    document.getElementById("status-label").textContent = text;
    el.classList.toggle("busy", !!text);
    document.getElementById("progress-bar").classList.toggle("hidden", !text);
  }

  // ── Apply a single action returned by the agent ───────────────────────────
  async function applyAction(action) {
    console.log("applyAction:", action);
    if (action.action === "load_pdb") {
      setStatus(`Loading ${action.pdb_id}…`);
      if (comp) stage.removeComponent(comp);
      repMap.clear();
      comp = await stage.loadFile(
        `https://files.rcsb.org/download/${action.pdb_id}.pdb`
      );
      if (!comp) throw new Error(`Failed to load PDB ${action.pdb_id}`);
      try {
        const defaultRep = comp.addRepresentation("cartoon", { sele: "protein", color: "spectrum", opacity: 1.0 });
        repMap.set("cartoon|protein", defaultRep);
      } catch (e) { console.warn("Default rep failed:", e); }
      comp.autoView();
    } else if (action.action === "add_rep") {
      if (!comp) throw new Error("No structure loaded — load a PDB first.");
      setStatus(`Updating ${action.type} representation…`);
      const key = `${action.type}|${action.selection}`;
      if (repMap.has(key)) {
        try { comp.removeRepresentation(repMap.get(key)); } catch (e) { console.warn("remove rep failed:", e); }
        repMap.delete(key);
      }
      try {
        const repr = comp.addRepresentation(action.type, {
          sele:    action.selection,
          color:   action.color   || "element",
          opacity: typeof action.opacity === "number" ? action.opacity : 1.0,
        });
        repMap.set(key, repr);
      } catch (e) { console.warn("NGL rep failed:", action.type, action.selection, e); }
    }
  }

  // ── Chat ──────────────────────────────────────────────────────────────────
  const USER_SVG = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>`;
  const BOT_SVG  = `<svg viewBox="0 0 24 24" width="18" height="18" fill="white" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="8" width="14" height="10" rx="2.5"/><rect x="8" y="5" width="8" height="3" rx="1.2"/><rect x="11" y="2.5" width="2" height="2.5" rx="1"/><circle cx="9.5" cy="13" r="1.6" fill="#7c3aed"/><circle cx="14.5" cy="13" r="1.6" fill="#7c3aed"/><rect x="9.2" y="15.6" width="5.6" height="1" rx="0.5" fill="#7c3aed"/><rect x="2" y="10" width="3" height="4.5" rx="1.2"/><rect x="19" y="10" width="3" height="4.5" rx="1.2"/></svg>`;

  function addMessage(role, text) {
    const row = document.createElement("div");
    row.className = `msg-row ${role}`;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    if (role === "user") {
      const av = document.createElement("div");
      av.className = "avatar user-avatar";
      av.innerHTML = USER_SVG;
      row.appendChild(bubble);
      row.appendChild(av);
    } else if (role === "assistant") {
      const av = document.createElement("div");
      av.className = "avatar bot-avatar";
      av.innerHTML = BOT_SVG;
      row.appendChild(av);
      row.appendChild(bubble);
    } else {
      row.appendChild(bubble);
    }

    const box = document.getElementById("messages");
    box.appendChild(row);
    box.scrollTop = box.scrollHeight;
  }

  async function sendMessage() {
    const ta = document.getElementById("prompt");
    const btn = document.getElementById("send-btn");
    const text = ta.value.trim();
    if (!text) return;

    ta.value = "";
    btn.disabled = true;
    addMessage("user", text);
    setStatus("Sending to agent…");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: text }),
      });

      if (!res.ok) {
        addMessage("assistant", `Server error ${res.status}. Check the console.`);
        return;
      }

      // Stream SSE events — each action is applied to the viewer as it arrives
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop() ?? "";   // keep any incomplete trailing line

        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          let evt;
          try { evt = JSON.parse(line.slice(6)); } catch { continue; }

          if (evt.evt === "action") {
            try {
              await applyAction(evt);
            } catch (e) {
              console.error("Action failed:", evt, e);
              if (evt.action === "load_pdb") throw e;  // fatal
            }
          } else if (evt.evt === "reply") {
            addMessage("assistant", evt.text);
          }
        }
      }
    } catch (err) {
      addMessage("assistant", `Error: ${err.message}`);
    } finally {
      btn.disabled = false;
      setStatus("");
    }
  }

  document.getElementById("send-btn").addEventListener("click", sendMessage);
  document.getElementById("prompt").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // ── Reset ─────────────────────────────────────────────────────────────────
  document.getElementById("reset-btn").addEventListener("click", async () => {
    await fetch("/api/reset", { method: "POST" });
    if (comp) { stage.removeComponent(comp); comp = null; }
    repMap.clear();
    document.getElementById("messages").innerHTML =
      '<div class="msg-row system"><div class="bubble">Load a structure to begin — e.g. "Load 3pp0"</div></div>';
  });
</script>

</body>
</html>
